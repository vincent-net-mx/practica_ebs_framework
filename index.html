<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica AWS EBS · ClínicaVida</title>
<script>try{if(localStorage.getItem("ebs_ui_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--l1:#f4f4f4;--l2:#e0e0e0;--bd:#e0e0e0;--tx:#161616;--tx2:#525252;--pri:#0f62fe;--lk:#0f62fe;--ok:#198038;--err:#da1e28;--fc:#0f62fe;--md:#fff;
--blue:#0043ce;--teal:#005d5d;--purple:#6929c4;--red:#a2191f;--gray:#525252;--green:#0e6027;color-scheme:light}
.dark{--bg:#161616;--l1:#262626;--l2:#393939;--bd:#393939;--tx:#f4f4f4;--tx2:#c6c6c6;--lk:#78a9ff;--ok:#42be65;--fc:#fff;--md:#262626;
--blue:#78a9ff;--teal:#08bdba;--purple:#be95ff;--red:#ff8389;--gray:#c6c6c6;--green:#42be65;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.43 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:.16px}
:focus-visible{outline:2px solid var(--fc);outline-offset:-2px}
code,pre,.mono,kbd{font-family:"IBM Plex Mono",Menlo,Consolas,monospace}
code{background:var(--l1);padding:1px 5px;font-size:12.5px}
kbd{background:var(--l2);padding:1px 6px;font-size:12px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid transparent;background:none;color:var(--lk);font:inherit;letter-spacing:.16px;cursor:pointer;text-decoration:none}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}.btn.block{width:100%;justify-content:space-between}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:#0353e9}
.btn.ter{border-color:var(--lk)}.btn.ter:hover{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ghost:hover{background:var(--l2)}.btn.dng{color:var(--err)}.btn.red{background:var(--err);color:#fff}
/* encabezado */
.hd{position:sticky;top:0;z-index:30;background:#161616;color:#f4f4f4}
.hd .row{display:flex;align-items:center;height:48px}
.hd .btn{color:#f4f4f4;min-height:48px}.hd .btn:hover{background:#2c2c2c}
.hd h1{font-size:14px;font-weight:600;margin:0 0 0 16px;white-space:nowrap}.hd h1 span{font-weight:400;color:#c6c6c6;margin-left:8px}
.hd .sp{flex:1}.hd .pg{font-size:13px;margin-right:8px;white-space:nowrap}
.hd .sv{position:relative}.hd .sv .dot{position:absolute;top:10px;right:8px;width:8px;height:8px;border-radius:50%;background:#f1c21b;display:none}
.hbar{height:3px;background:#393939}.hbar i{display:block;height:100%;background:#42be65;width:0;transition:width .25s}
#menu{display:none}
/* estructura */
.shell{display:flex}
.side{width:288px;flex:none;background:var(--l1);border-right:1px solid var(--bd);position:sticky;top:51px;height:calc(100vh - 51px);overflow:auto}
.pan{padding:24px 16px;border-bottom:1px solid var(--bd)}
.big{font-size:42px;font-weight:300;line-height:1.1}.big small{font-size:20px;margin-left:2px}
.mu{color:var(--tx2);font-size:12px;margin:4px 0 0}
.meter{margin-top:14px}.mh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.mh b{font-weight:600}
.bar{height:4px;background:var(--l2)}.bar i{display:block;height:100%;background:var(--pri);transition:width .25s}.bar.ok i{background:var(--ok)}
.pan .btn{margin-top:20px}
.bk{margin-top:14px;font-size:12px;color:var(--tx2);display:flex;gap:8px;align-items:flex-start}
.bk .dot{width:8px;height:8px;border-radius:50%;background:#8d8d8d;margin-top:5px;flex:none}.bk .dot.w{background:#f1c21b}.bk .dot.g{background:var(--ok)}
.nv{padding:8px 0}.nv button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:0 16px;background:none;border:0;border-left:3px solid transparent;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.nv button:hover{background:var(--l2)}.nv button.on{border-left-color:var(--pri);background:var(--l2);font-weight:600}
.nv .c{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}.nv .c.ok{color:var(--ok)}
.nv .sub{min-height:32px;padding-left:32px;font-size:13px;color:var(--tx2)}.nv .sub span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;min-width:0;padding:32px 48px 96px;max-width:960px}
main h1{font-size:32px;font-weight:300;line-height:1.25;margin:0}.sub1{color:var(--tx2);font-size:16px;margin:4px 0 24px}
.lead{max-width:70ch;font-size:14px;line-height:1.6}
.note{border-left:3px solid #f1c21b;background:var(--l1);padding:12px 16px;margin:16px 0}.note ul{margin:6px 0 0;padding-left:18px}
.acc{border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin:16px 0}.acc summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.acc>div{padding:0 0 16px;max-width:75ch;line-height:1.6}.acc p{margin:8px 0}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{background:var(--l1);text-align:left}th,td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
.flow{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px;padding:0;margin:0 0 8px}
.flow li{background:var(--l1);padding:12px 16px;display:grid;gap:6px;border-top:3px solid var(--pri)}.flow b{font-weight:300;font-size:24px}
.tg{display:inline-block;padding:2px 8px;border-radius:16px;font-size:12px;line-height:18px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
/* secciones y pasos */
.sec{margin-top:48px}.sec>header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.sec h3{font-size:20px;font-weight:400;margin:0;max-width:60ch}.sh{display:flex;gap:12px;align-items:center}.cnt{font-size:13px;font-variant-numeric:tabular-nums}
.sec>.bar{margin:12px 0 0}.sec.warn h3{color:var(--err)}.sec.warn>.bar i{background:var(--err)}
.st{display:flex;gap:12px;padding:20px 0 20px 12px;border-bottom:1px solid var(--bd);border-left:3px solid transparent}
.st.done{border-left-color:var(--ok)}.st.done h4{color:var(--tx2)}
.st.flash{animation:fl 1.6s}@keyframes fl{0%,60%{background:color-mix(in srgb,var(--pri) 14%,transparent)}}
.ck{position:relative;width:20px;height:20px;flex:none;margin-top:1px;cursor:pointer}.ck input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ck i{position:absolute;inset:2px;border:1px solid var(--tx);pointer-events:none}.ck input:checked+i{background:var(--tx)}
.ck input:checked+i::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.ck input:focus-visible+i{outline:2px solid var(--fc);outline-offset:2px}
.sb{flex:1;min-width:0}.sm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cd{font:500 12px "IBM Plex Mono",monospace;color:var(--tx2)}
.st h4{font-size:16px;font-weight:600;margin:6px 0}.st p{margin:0 0 12px;max-width:70ch;line-height:1.6}
/* bloque de código */
.code{background:var(--l1);margin:12px 0}.code-h{display:flex;justify-content:space-between;align-items:center;padding-left:16px;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--bd)}
.code pre{margin:0;padding:14px 16px;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.code pre.clip{max-height:150px;overflow:hidden}.code pre code{background:none;padding:0;font-size:inherit}
.code .more{margin:0 0 4px 4px}
/* evidencias */
.ev{border:1px solid var(--bd);padding:16px;margin-top:8px}.ev.has{border-color:var(--ok)}
.evh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.ev h4{margin:10px 0 0!important}
.cap{margin:10px 0!important;color:var(--tx2);font-size:13px}.zone{border:1px dashed var(--tx2);padding:20px;text-align:center;outline-offset:-3px}
.zone.over,.zone:focus{background:color-mix(in srgb,var(--pri) 10%,transparent);border-color:var(--pri)}.zone p{margin:8px 0 12px!important}
.acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:6px}.has .acts{justify-content:flex-start}
.shot{display:block;max-width:100%;max-height:260px;border:1px solid var(--bd);cursor:zoom-in}
.lb{display:block;font-size:12px;color:var(--tx2);margin:14px 0 4px}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--tx);background:var(--l1);border:0;border-bottom:1px solid #8d8d8d;padding:10px 16px;min-height:40px;resize:vertical;letter-spacing:.16px}
.seg{display:flex;margin:16px 0 8px;flex-wrap:wrap}.seg button{flex:1;min-width:110px;min-height:40px;border:0;border-bottom:2px solid var(--bd);background:none;color:var(--tx2);font:inherit;cursor:pointer}
.seg button.on{border-bottom-color:var(--pri);color:var(--tx);font-weight:600}.evg{display:grid;gap:16px}
.q{padding:20px 0;border-bottom:1px solid var(--bd)}.q h4{margin:0 0 8px;font-size:16px;font-weight:600;max-width:70ch;line-height:1.4}.q details{margin:8px 0 12px;font-size:13px;color:var(--tx2);max-width:70ch}.q summary{cursor:pointer;color:var(--lk)}
/* modales y toasts */
.ov{position:fixed;inset:0;background:rgba(22,22,22,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.ov.on{display:flex}
.md{background:var(--md);width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column}
.md.wide{max-width:1000px}.md h2{margin:0;padding:16px 56px 0 16px;font-size:20px;font-weight:400}.mb{padding:16px;display:grid;gap:16px}
.mf{display:flex;justify-content:flex-end;margin-top:8px}.mf .btn{min-width:160px;min-height:64px;align-items:flex-start;padding-top:16px}
.x{position:absolute;right:0;top:0}.md{position:relative}
.rt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rt label{border:1px solid var(--bd);padding:12px;cursor:pointer;display:grid;gap:2px}
.rt label:has(input:checked){border:2px solid var(--pri);padding:11px}.rt input{position:absolute;opacity:0}.rt b{font-weight:600}.rt span{font-size:12px;color:var(--tx2)}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fl label{font-size:12px;color:var(--tx2)}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60}
.toast{background:var(--tx);color:var(--bg);border-left:3px solid var(--c,#4589ff);padding:12px 16px;min-width:240px;max-width:380px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@media(max-width:1055px){#menu{display:inline-flex}.side{position:fixed;left:0;top:51px;z-index:25;transform:translateX(-100%);transition:transform .2s;width:300px}.side.open{transform:none}
main{padding:24px 16px 80px}.hd .lbl{display:none}.hd h1 span{display:none}.fl,.rt{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hd">
  <div class="row">
    <button class="btn" id="menu" aria-label="Abrir navegación" onclick="document.querySelector('.side').classList.toggle('open')"></button>
    <h1>Práctica AWS EBS<span>ClínicaVida · us-east-1</span></h1>
    <div class="sp"></div>
    <span class="pg" id="hp"></span>
    <button class="btn sv" onclick="saveProgress()" title="Guardar progreso (descarga un .json)" id="b-save"><span class="dot" id="sdot"></span><span class="lbl">Guardar progreso</span></button>
    <button class="btn" onclick="$('#imp').click()" title="Cargar progreso desde un .json" id="b-load"><span class="lbl">Cargar progreso</span></button>
    <input type="file" id="imp" accept=".json,application/json" hidden onchange="loadProgress(event)">
    <button class="btn" onclick="openExport()" title="Exportar reporte (Ctrl+E)" id="b-exp"><span class="lbl">Reporte</span></button>
    <button class="btn" onclick="toggleTheme()" title="Cambiar tema" id="b-th"></button>
    <button class="btn" onclick="openOv('reset-ov')" title="Reiniciar práctica" id="b-rs"></button>
  </div>
  <div class="hbar"><i id="hbar"></i></div>
</header>
<div class="shell"><aside class="side" id="side"></aside><main id="main"></main></div>

<div class="ov" id="lb-ov" onclick="if(event.target===this)closeOv('lb-ov')"><div class="md wide"><button class="btn x" onclick="closeOv('lb-ov')" aria-label="Cerrar" id="lb-x"></button><h2 id="lb-t"></h2>
  <div class="mb"><img id="lb-img" alt="" style="max-width:100%;max-height:70vh;margin:auto"><div class="mf" style="justify-content:flex-start;margin:0"><button class="btn ter sm" id="lb-dl">Descargar</button></div></div></div></div>

<div class="ov" id="export-modal" onclick="if(event.target===this)closeOv('export-modal')"><div class="md"><button class="btn x" onclick="closeOv('export-modal')" aria-label="Cerrar" id="ex-x"></button><h2>Exportar reporte final</h2>
  <div class="mb">
    <div class="rt"><label><input type="radio" name="exp-format" value="html" checked><b>HTML</b><span>Autocontenido</span></label><label><input type="radio" name="exp-format" value="md"><b>Markdown</b><span>.zip con imágenes</span></label><label><input type="radio" name="exp-format" value="pdf"><b>PDF</b><span>Diálogo de impresión</span></label></div>
    <div><label class="lb" for="export-theme">Estilo visual del reporte</label><select id="export-theme"></select></div>
    <div class="fl"><div><label class="lb" for="export-student-name">Estudiante / equipo</label><input type="text" id="export-student-name"></div><div><label class="lb" for="export-student-group">Matrícula / grupo / materia</label><input type="text" id="export-student-group"></div></div>
    <p class="mu" id="export-summary-pill"></p></div>
  <div class="mf"><button class="btn ghost" style="min-width:120px;min-height:64px;align-items:flex-start;padding-top:16px" onclick="closeOv('export-modal')">Cancelar</button><button class="btn pri" onclick="runExport()">Generar reporte</button></div></div></div>

<div class="ov" id="reset-ov" onclick="if(event.target===this)closeOv('reset-ov')"><div class="md"><h2>¿Reiniciar toda la práctica?</h2>
  <div class="mb"><p style="margin:0">Se borrarán pasos completados, notas, respuestas y capturas guardadas en este navegador. Si no has guardado un .json, no podrás recuperarlas.</p></div>
  <div class="mf"><button class="btn ghost" style="min-width:120px;min-height:64px;align-items:flex-start;padding-top:16px" onclick="closeOv('reset-ov')">Cancelar</button><button class="btn red" onclick="confirmReset()">Borrar y reiniciar</button></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
    const EVIDENCES_META = {
      E01: {
        id: 'E01',
        part: 'Parte 1',
        tab: 'tab1',
        stepId: 'step-1-2-7',
        fileName: 'P1-E01-lsblk-huellas.png',
        env: 'EC2 Instance Connect',
        title: 'Evidencia 1 — Volumen EBS montado y huellas SHA-256 iniciales',
        whatToCapture: 'Salida en terminal de lsblk -o NAME,SIZE,SERIAL,FSTYPE,MOUNTPOINT (mostrando nvme1n1 de 1G formateado en xfs y montado en /datos) y cat ~/huellas.txt (mostrando los dos hashes SHA-256 de pacientes.csv y receta-P002.txt).',
        command: 'lsblk -o NAME,SIZE,SERIAL,FSTYPE,MOUNTPOINT && cat ~/huellas.txt'
      },
      E02: {
        id: 'E02',
        part: 'Parte 1',
        tab: 'tab1',
        stepId: 'step-1-3-1',
        fileName: 'P1-E02-cloudshell-volumenes.png',
        env: 'AWS CloudShell',
        title: 'Evidencia 2 — Estado inicial de volúmenes y cifrado por defecto en CloudShell',
        whatToCapture: 'Tabla de volúmenes en CloudShell mostrando vol-expedientes con Cifrado = False en us-east-1a, junto con la salida de get-ebs-encryption-by-default.',
        command: 'aws ec2 describe-volumes --query "Volumes[].{ID:VolumeId,Nombre:Tags[?Key==\'Name\']|[0].Value,Zona:AvailabilityZone,Cifrado:Encrypted,Estado:State}" --output table && aws ec2 get-ebs-encryption-by-default'
      },
      E03: {
        id: 'E03',
        part: 'Parte 2',
        tab: 'tab2',
        stepId: 'step-2-2-2',
        fileName: 'P2-E03-ataque-ls-datos.png',
        env: 'EC2 Instance Connect',
        title: 'Evidencia 3 — Directorio /datos tras el ataque simulado de ransomware',
        whatToCapture: 'Salida de ls -l /datos evidenciando la nota de rescate LEEME-RESCATE.txt y los archivos originales sustituidos por pacientes.csv.cifrado y receta-P002.txt.cifrado.',
        command: 'echo "Tus expedientes fueron cifrados. Paga 2 BTC." > /datos/LEEME-RESCATE.txt && ls -l /datos'
      },
      E04: {
        id: 'E04',
        part: 'Parte 2',
        tab: 'tab2',
        stepId: 'step-2-2-3',
        fileName: 'P2-E04-cabecera-salted.png',
        env: 'EC2 Instance Connect',
        title: 'Evidencia 4 — Cabecera binaria cifrada (Salted__) con OpenSSL',
        whatToCapture: 'Salida del comando head/od mostrando los primeros 32 bytes ilegibles del archivo cifrado iniciando con la firma S a l t e d _ _.',
        command: 'head -c 32 /datos/pacientes.csv.cifrado | od -An -c'
      },
      E05: {
        id: 'E05',
        part: 'Parte 2',
        tab: 'tab2',
        stepId: 'step-2-4-2',
        fileName: 'P2-E05-error-uuid-dmesg.png',
        env: 'EC2 Instance Connect',
        title: 'Evidencia 5 — Rechazo de montaje por UUID duplicado en XFS (dmesg)',
        whatToCapture: 'Error de mount al intentar montar vol-restaurado sin -o nouuid junto con la salida de sudo dmesg | tail -3 mostrando "Filesystem has duplicate UUID".',
        command: 'DEV2=/dev/nvme2n1 && sudo mkdir -p /restaurado && sudo mount $DEV2 /restaurado; sudo dmesg | tail -3'
      },
      E06: {
        id: 'E06',
        part: 'Parte 2',
        tab: 'tab2',
        stepId: 'step-2-4-3',
        fileName: 'P2-E06-recuperacion-sha256-ok.png',
        env: 'EC2 Instance Connect',
        title: 'Evidencia 6 — Verificación de integridad SHA-256 (OK) y recuperación de /datos',
        whatToCapture: 'Listado de /restaurado y las dos comprobaciones de sha256sum -c terminadas en OK confirmando que /datos quedó recuperado íntegramente.',
        command: 'sudo mount -o nouuid $DEV2 /restaurado && ls -l /restaurado && sed \'s#/datos/#/restaurado/#\' ~/huellas.txt | sha256sum -c && rm -f /datos/* && cp /restaurado/* /datos/ && sha256sum -c ~/huellas.txt'
      },
      E07: {
        id: 'E07',
        part: 'Parte 3',
        tab: 'tab3',
        stepId: 'step-3-2-2',
        fileName: 'P3-E07-cifrado-predeterminado-cli.png',
        env: 'AWS CloudShell',
        title: 'Evidencia 7 — Cifrado predeterminado de EBS activo y prueba automática',
        whatToCapture: 'Salida de CloudShell mostrando "EbsEncryptionByDefault": true, el volumen de prueba creado sin especificar cifrado devolviendo true y su KmsKeyId, y "Volumen de prueba eliminado".',
        command: 'aws ec2 get-ebs-encryption-by-default && PRUEBA=$(aws ec2 create-volume --availability-zone us-east-1a --size 1 --volume-type gp3 --query VolumeId --output text) && echo "Creado: $PRUEBA" && aws ec2 describe-volumes --volume-ids $PRUEBA --query \'Volumes[0].[VolumeId,Encrypted,KmsKeyId]\' && aws ec2 wait volume-available --volume-ids $PRUEBA && aws ec2 delete-volume --volume-id $PRUEBA && echo "Volumen de prueba eliminado"'
      },
      E08: {
        id: 'E08',
        part: 'Parte 3',
        tab: 'tab3',
        stepId: 'step-4-1',
        fileName: 'P3-E08-bloqueo-publico-cli.png',
        env: 'AWS CloudShell',
        title: 'Evidencia 8 — Bloqueo de acceso público a instantáneas (block-all-sharing)',
        whatToCapture: 'Comandos en CloudShell mostrando el cambio de "unblocked" a "block-all-sharing" y el mensaje de error de AWS rechazando modify-snapshot-attribute con --group-names all.',
        command: 'SNAP=$(aws ec2 describe-snapshots --owner-ids self --filters Name=tag:Name,Values=snap-expedientes-v1 --query \'Snapshots[0].SnapshotId\' --output text) && echo "Snapshot: $SNAP" && aws ec2 get-snapshot-block-public-access-state && aws ec2 enable-snapshot-block-public-access --state block-all-sharing && aws ec2 modify-snapshot-attribute --snapshot-id $SNAP --attribute createVolumePermission --operation-type add --group-names all'
      },
      E09: {
        id: 'E09',
        part: 'Parte 3',
        tab: 'tab3',
        stepId: 'step-4-2',
        fileName: 'P3-E09-bloqueo-publico-consola.png',

              evidenceId: 'E09'
            }
          ]
        },
        {
          id: 'sub-5',
          title: 'Subsección 5 — LIMPIEZA OBLIGATORIA (Teardown — Evitar cargos)',
          badge: 'Teardown Crítico',
          isWarning: true,
          description: 'Asegúrate de haber guardado todas tus evidencias antes de desmontar y eliminar los recursos creados.',
          steps: [
            {
              id: 'step-l-1',
              code: 'Paso L.1',
              env: 'EC2 Instance Connect',
              title: 'Desmontar los tres puntos de montaje en Linux',
              text: 'Desmonta <code class="font-mono text-sky-300">/datos</code>, <code class="font-mono text-sky-300">/restaurado</code> y <code class="font-mono text-sky-300">/cifrado</code> en la instancia:',
              command: 'sudo umount /datos /restaurado /cifrado'
            },
            {
              id: 'step-l-2',
              code: 'Paso L.2',
              env: 'Consola AWS',
              title: 'Desasociar y eliminar los 3 volúmenes de 1 GiB',
              text: 'En <strong>EC2 &gt; Volúmenes</strong>, desasocia y elimina <code class="font-mono text-amber-300">vol-expedientes</code>, <code class="font-mono text-amber-300">vol-restaurado</code> y <code class="font-mono text-amber-300">vol-cifrado</code> (borra todos los de 1 GiB; <strong>no toques el volumen raíz de 8 GiB</strong>).'
            },
            {
              id: 'step-l-3',
              code: 'Paso L.3',
              env: 'Consola AWS',
              title: 'Eliminar las 2 instantáneas creadas',
              text: 'En <strong>EC2 &gt; Instantáneas</strong>, elimina <code class="font-mono text-amber-300">snap-expedientes-v1</code> y <code class="font-mono text-amber-300">snap-expedientes-cifrada</code>.'
            },
            {
              id: 'step-l-4',
              code: 'Paso L.4',
              env: 'Consola AWS',
              title: 'Terminar instancia EC2 y eliminar Grupo de Seguridad',
              text: 'Termina la instancia <code class="font-mono text-amber-300">clinicavida-app</code> y elimina el grupo de seguridad <code class="font-mono text-amber-300">sgClinicavida</code>. Deja activados el cifrado predeterminado y el bloqueo público de instantáneas (no tienen costo y son buenas prácticas).'
            },
            {
              id: 'step-l-5',
              code: 'Paso L.5',
              env: 'AWS CloudShell',
              title: 'Auditoría final en CloudShell: cero volúmenes y cero snapshots activos',
              text: 'Verifica en <code class="font-mono text-sky-300">us-east-1</code> que ambas consultas devuelvan listas vacías (o únicamente el volumen raíz mientras la instancia termina):',
              command: 'aws ec2 describe-volumes --query \'Volumes[].[VolumeId,State]\' --output table && aws ec2 describe-snapshots --owner-ids self --query \'Snapshots[].SnapshotId\''
            }
          ]
        }
      ]
    };

    const ANALYSIS_QUESTIONS = [
      {
        id: 'q1',
        number: 1,
        question: '¿Qué principio de la triada CIA protege cada control de la práctica: instantánea, cifrado de EBS, bloqueo de acceso público? Justifica cada uno.',
        hint: 'Relaciona cada mecanismo con Disponibilidad (recuperación ante desastres/ransomware), Confidencialidad en reposo/tránsito (protección física y de almacenamiento subyacente) y Confidencialidad / Prevención de fuga externa (control de exposición de permisos).'
      },
      {
        id: 'q2',
        number: 2,
        question: 'Si un atacante obtiene una sesión SSH en clinicavida-app, ¿el cifrado de EBS le impide leer pacientes.csv? ¿Qué controles sí lo mitigarían?',
        hint: 'Recuerda cómo funciona el cifrado transparente del host Nitro: cuando el volumen está montado en el SO en ejecución, la instancia lee los datos en claro. Piensa en controles a nivel de SO, red, IAM y cifrado a nivel de aplicación.'
      },
      {
        id: 'q3',
        number: 3,
        question: '¿Por qué ClínicaVida no puede simplemente «activar el cifrado» en vol-expedientes? Describe el procedimiento completo para migrar la aplicación al volumen cifrado con el menor tiempo de inactividad.',
        hint: 'Un volumen EBS no se cifra in-place. El flujo es: detener escrituras (ventana breve de mantenimiento) -> crear snapshot final -> copiar snapshot marcando cifrado KMS -> crear volumen desde copia cifrada en la misma AZ -> desmontar/desasociar volumen antiguo -> asociar y montar volumen cifrado en /datos (actualizando /etc/fstab por UUID).'
      },
      {
        id: 'q4',
        number: 4,
        question: 'Un volumen EBS existe en una sola zona de disponibilidad. ¿Qué pasa con los expedientes si falla us-east-1a? ¿Cómo ayudan las instantáneas y la copia a otra región?',
        hint: 'Si cae us-east-1a, el volumen queda inaccesible mientras dure la interrupción de la AZ. Las instantáneas viven en S3 (almacenamiento regional redundante), permitiendo crear un nuevo volumen en us-east-1b; y la copia de snapshot entre regiones (Cross-Region Snapshot Copy) protege ante desastres regionales completos.'
      },
      {
        id: 'q5',
        number: 5,
        question: 'En un ataque real de ransomware en la nube, ¿por qué el atacante intentaría borrar las instantáneas primero? ¿Qué permisos de IAM restringirías?',
        hint: 'Si las instantáneas sobreviven, la víctima recupera sus datos sin pagar rescate. Restringirías ec2:DeleteSnapshot (aplicando principio de menor privilegio, condiciones con etiquetas, SCPs o AWS Backup Vault Lock / Papelera de reciclaje de AWS con reglas de retención).'
      }
    ];

const INTRO="<strong>ClínicaVida</strong> es una red de consultorios médicos en Guadalajara cuya aplicación de expedientes clínicos corre en una instancia EC2 (<code class=\"text-amber-300 font-mono bg-slate-800/80 px-1.5 py-0.5 rounded\">clinicavida-app</code>) y almacena los archivos sensibles de pacientes en un volumen Amazon EBS adicional (<code class=\"text-amber-300 font-mono bg-slate-800/80 px-1.5 py-0.5 rounded\">vol-expedientes</code>).", CMP=[["Tipo", "Bloque (disco virtual montable)", "Objetos (archivos + metadatos)"], ["Alcance", "Una sola Zona de Disponibilidad (AZ)", "Regional (replicado en múltiples AZ)"], ["Acceso", "Una instancia EC2 (salvo Multi-Attach en io1/io2)", "API / HTTPS desde cualquier lugar autorizado"], ["Respaldo", "Instantáneas incrementales (almacenadas por AWS en S3)", "Control de versiones, replicación entre regiones"], ["Cifrado en reposo", "Opcional; se puede forzar con cifrado predeterminado", "SSE-S3 siempre activo por defecto desde 2023"], ["Exposición pública", "Instantáneas compartibles con «Público» (bloqueable)", "Buckets/objetos vía políticas y Block Public Access"]], XFS="<p><strong class=\"text-white\">1. UUID Duplicado en XFS:</strong> El volumen restaurado (<code class=\"font-mono text-amber-300\">vol-restaurado</code>) es una copia exacta bloque a bloque de <code class=\"font-mono text-amber-300\">vol-expedientes</code>, por lo que su sistema de archivos XFS conserva exactamente el mismo UUID que <code class=\"font-mono text-amber-300\">/datos</code>. Por seguridad, el kernel Linux rechaza montar dos sistemas de archivos con el mismo UUID simultáneamente. La opción <code class=\"font-mono text-emerald-400\">-o nouuid</code> omite esa validación de forma temporal (en entornos de producción permanentes se regeneraría con <code class=\"font-mono text-sky-400\">xfs_admin -U generate</code>).</p><p><strong class=\"text-white\">2. Carga diferida (Lazy Loading) vs. FSR:</strong> Los bloques de un volumen restaurado desde una instantánea se descargan de Amazon S3 de forma asíncrona la primera vez que se leen. Existe la función <em>Restauración rápida de instantáneas (FSR)</em> que elimina esa latencia inicial, pero genera un cargo elevado por hora: <strong>no la actives</strong>.</p><p><strong class=\"text-rose-400\">3. Advertencia crítica:</strong> En esta sección <strong>nunca</strong> ejecutes <code class=\"font-mono text-rose-300\">mkfs</code> sobre <code class=\"font-mono text-amber-300\">vol-restaurado</code>, ya que formatearía el disco y destruiría los datos respaldados.</p>";
</script>
<script>
const $=s=>document.querySelector(s);
const ICON={copy:'<rect x="9" y="9" width="11" height="11"/><path d="M5 15V4h11"/>',check:'<path d="M5 12l5 5 9-10"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
img:'<rect x="3" y="4" width="18" height="16"/><path d="M3 16l5-5 4 4 3-3 6 6"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',moon:'<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>',file:'<path d="M7 3h7l4 4v14H7zM14 3v4h4"/>',
dl:'<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/>',ul:'<path d="M12 15V4m0 0L8 8m4-4l4 4M5 20h14"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
$('#menu').innerHTML=ic('menu');$('#b-th').innerHTML=ic('moon');$('#b-rs').innerHTML=ic('trash');$('#lb-x').innerHTML=ic('x');$('#ex-x').innerHTML=ic('x');
$('#b-save').insertAdjacentHTML('afterbegin',ic('dl'));$('#b-load').insertAdjacentHTML('afterbegin',ic('ul'));$('#b-exp').insertAdjacentHTML('afterbegin',ic('file'));

const STORAGE_KEY='clinicavida_ebs_state_v1',META_KEY='ebs_backup_meta',DB_NAME='ClinicaVidaEBS_DB';
let db=null,evidenceImages={},meta={backupAt:null,dirty:false},lastEv=null;
let appState={completedSteps:{},evidenceNotes:{},analysisAnswers:{},studentInfo:{name:'',group:''},activeTab:'tab1',evidenceFilter:'all'};
const PARTS={tab1:['Parte 1','Preparación y volumen sin cifrar'],tab2:['Parte 2','Respaldo y recuperación ante ransomware'],tab3:['Parte 3','Cifrado, bloqueo público y limpieza']};
const FLOW=[['Respaldo limpio','AWS CloudShell'],['Ataque simulado','EC2 Instance Connect'],['Restauración EBS','Consola AWS'],['Recuperación SHA-256','EC2 Instance Connect']];

function escapeHtml(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'):''}
const E=escapeHtml,clean=h=>String(h).replace(/\sclass="[^"]*"/g,''),pctOf=(a,b)=>b?Math.round(a/b*100):0;
const envKind=e=>/CloudShell/.test(e)?'purple':/Instance Connect/.test(e)?'teal':/Teardown/.test(e)?'red':'blue';
const tag=(t,k)=>`<span class="tg" style="--c:var(--${k||envKind(t)})">${E(t)}</span>`;
const meter=(l,a,b)=>`<div class="meter"><div class="mh"><span>${l}</span><b>${a}/${b}</b></div><div class="bar${a&&a===b?' ok':''}"><i style="width:${pctOf(a,b)}%"></i></div></div>`;
const allSteps=()=>['tab1','tab2','tab3'].flatMap(k=>CURRICULUM[k].flatMap(s=>s.steps));
const answered=q=>(appState.analysisAnswers[q.id]||'').trim().length>0;
function stats(){const st=allSteps(),sd=st.filter(s=>appState.completedSteps[s.id]).length,ev=Object.keys(EVIDENCES_META),ed=ev.filter(i=>evidenceImages[i]).length,qd=ANALYSIS_QUESTIONS.filter(answered).length,qt=ANALYSIS_QUESTIONS.length,T=st.length+ev.length+qt,D=sd+ed+qd;return{st:st.length,sd,et:ev.length,ed,qt,qd,T,D,pct:pctOf(D,T)}}

/* ---------- persistencia ---------- */
function persistMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(meta))}catch(e){}}
function loadLocalState(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(p)appState={...appState,...p};const m=JSON.parse(localStorage.getItem(META_KEY)||'null');if(m)meta=m}catch(e){}}
function saveLocalState(dirty=true){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appState))}catch(e){}if(dirty){meta.dirty=true;persistMeta()}renderSide()}
const idb=(mode,fn)=>new Promise((res,rej)=>{if(!db)return rej();try{const r=fn(db.transaction('evidences',mode).objectStore('evidences'));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const initDB=()=>new Promise((res,rej)=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('evidences'))e.target.result.createObjectStore('evidences',{keyPath:'id'})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
async function putImg(r){evidenceImages[r.id]=r;try{await idb('readwrite',s=>s.put(r))}catch(e){}}
async function delImg(id){delete evidenceImages[id];try{await idb('readwrite',s=>s.delete(id))}catch(e){}}
async function clearImgs(){evidenceImages={};try{await idb('readwrite',s=>s.clear())}catch(e){}}

/* ---------- utilidades ---------- */
function showToast(m,t='info'){const c={success:'#42be65',error:'#fa4d56',warning:'#f1c21b',info:'#4589ff'}[t];const d=document.createElement('div');d.className='toast';d.style.setProperty('--c',c);d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),4200)}
const openOv=id=>$('#'+id).classList.add('on'),closeOv=id=>$('#'+id).classList.remove('on');
function toggleTheme(){const r=document.documentElement;r.classList.toggle('dark');try{localStorage.setItem('ebs_ui_theme',r.classList.contains('dark')?'dark':'light')}catch(e){}}

/* ---------- copiar (los comandos viven en memoria, nunca en atributos HTML) ---------- */
const CMD={};
async function copyCmd(id,btn){
  const t=CMD[id];let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true}}catch(e){}
  if(!ok){const ta=document.createElement('textarea');ta.value=t;ta.readOnly=true;ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);try{ok=document.execCommand('copy')}catch(e){}ta.remove()}
  const lab=btn.querySelector('span');btn.dataset.o=btn.dataset.o||lab.textContent;
  if(ok){lab.textContent='¡Copiado!';showToast('Comando copiado al portapapeles','success')}
  else{const pre=$('#c-'+id),r=document.createRange();pre.classList.remove('clip');r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);lab.textContent='Seleccionado';showToast('No se pudo copiar automáticamente: el comando quedó seleccionado, presiona Ctrl+C.','warning')}
  clearTimeout(btn._t);btn._t=setTimeout(()=>lab.textContent=btn.dataset.o,1800);
}
function toggleCode(b){const p=b.previousElementSibling,c=p.classList.toggle('clip');b.textContent=c?'Mostrar todo':'Mostrar menos'}
function codeBlock(id,cmd,label){CMD[id]=cmd;const long=cmd.length>240||cmd.split('\n').length>6;
  return `<div class="code"><div class="code-h"><span>${E(label)}</span><button class="btn ghost sm" onclick="copyCmd('${id}',this)">${ic('copy')}<span>Copiar comando</span></button></div><pre id="c-${id}"${long?' class="clip"':''}><code>${E(cmd)}</code></pre>${long?'<button class="btn ghost sm more" onclick="toggleCode(this)">Mostrar todo</button>':''}</div>`}

/* ---------- evidencias ---------- */
function processImageFile(id,f){if(!f||!f.type.startsWith('image/'))return showToast('Selecciona o pega un archivo de imagen válido.','warning');
  const r=new FileReader();r.onload=async e=>{await putImg({id,dataUrl:e.target.result,fileName:EVIDENCES_META[id].fileName,originalName:f.name||'captura.png',updatedAt:new Date().toLocaleString('es-MX',{hour12:false})});meta.dirty=true;persistMeta();refreshEv(id);showToast(`Evidencia ${id} guardada.`,'success')};r.readAsDataURL(f)}
function pickFile(id,i){if(i.files[0]){processImageFile(id,i.files[0]);i.value=''}}
function dropImg(id,e){e.preventDefault();e.currentTarget.classList.remove('over');processImageFile(id,e.dataTransfer.files[0])}
function dragZ(e,on){e.preventDefault();e.currentTarget.classList.toggle('over',!!on)}
async function pasteBtn(id){lastEv=id;try{for(const it of await navigator.clipboard.read()){const t=it.types.find(x=>x.startsWith('image/'));if(t)return processImageFile(id,await it.getType(t))}showToast('No hay imagen en el portapapeles.','warning')}catch(e){showToast(`Zona ${id} activa: presiona Ctrl+V para pegar tu captura.`,'info')}}
document.addEventListener('paste',e=>{if(!lastEv||/^(TEXTAREA|INPUT)$/.test(e.target.tagName))return;const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();processImageFile(lastEv,it.getAsFile())}});
document.addEventListener('focusin',e=>{const c=e.target.closest&&e.target.closest('[data-ev]');if(c)lastEv=c.dataset.ev});
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('[data-ev]');if(c)lastEv=c.dataset.ev});
async function rmImg(id){await delImg(id);meta.dirty=true;persistMeta();refreshEv(id)}
function downloadSingleEvidence(id){const r=evidenceImages[id];if(r){const a=document.createElement('a');a.href=r.dataUrl;a.download=EVIDENCES_META[id].fileName;document.body.appendChild(a);a.click();a.remove()}}
function setNote(id,v){appState.evidenceNotes[id]=v;saveLocalState()}
function refreshEv(id){document.querySelectorAll(`[data-ev="${id}"]`).forEach(s=>s.innerHTML=evBlock(id,s.dataset.c==='1'));if(appState.activeTab==='tab4'&&appState.evidenceFilter!=='all')renderMain();renderSide()}
function openLb(id){const r=evidenceImages[id],m=EVIDENCES_META[id];$('#lb-t').textContent=`${m.fileName} · ${m.title}`;$('#lb-img').src=r.dataUrl;$('#lb-dl').onclick=()=>downloadSingleEvidence(id);openOv('lb-ov')}
function evBlock(id,center){const m=EVIDENCES_META[id],r=evidenceImages[id],n=appState.evidenceNotes[id]||'';
  const file=`<input type="file" accept="image/*" hidden onchange="pickFile('${id}',this)">`;
  return `<div class="ev${r?' has':''}"><div class="evh"><div><span class="cd">${id}</span> <span class="mono" style="font-size:12px">${E(m.fileName)}</span></div>${tag(r?'Completada':'Pendiente',r?'green':'gray')}</div>${center?`<h4>${E(m.title)}</h4>`:''}
  <p class="cap"><b>Qué capturar:</b> ${E(m.whatToCapture)}</p>
  ${r?`<img class="shot" src="${r.dataUrl}" alt="${E(m.fileName)}" onclick="openLb('${id}')"><div class="acts"><button class="btn ghost sm" onclick="openLb('${id}')">Ampliar</button><button class="btn ghost sm" onclick="downloadSingleEvidence('${id}')">Descargar</button><label class="btn ghost sm">Reemplazar${file}</label><button class="btn ghost sm dng" onclick="rmImg('${id}')">Eliminar</button><span class="mu">${E(r.updatedAt||'')}</span></div>`
  :`<div class="zone" tabindex="0" ondrop="dropImg('${id}',event)" ondragover="dragZ(event,1)" ondragleave="dragZ(event,0)">${ic('img')}<p>Arrastra tu captura aquí, o haz clic y pega con <kbd>Ctrl</kbd> + <kbd>V</kbd></p><div class="acts"><label class="btn ter sm">Seleccionar imagen${file}</label><button class="btn ghost sm" onclick="pasteBtn('${id}')">Pegar del portapapeles</button></div></div>`}
  <label class="lb">Observación técnica (opcional, se incluye en el reporte)</label><textarea rows="2" oninput="setNote('${id}',this.value)">${E(n)}</textarea>
  ${center?`<div class="acts" style="justify-content:flex-start"><button class="btn ghost sm" onclick="goStep('${m.tab}','${m.stepId}')">Ir al paso</button></div>`:''}</div>`}

/* ---------- vistas ---------- */
function stepHtml(s){const d=!!appState.completedSteps[s.id];
  return `<article class="st${d?' done':''}" id="${s.id}"><label class="ck"><input type="checkbox"${d?' checked':''} onchange="toggleStep('${s.id}',this.checked)" aria-label="Completar ${E(s.code)}"><i></i></label><div class="sb"><div class="sm"><span class="cd">${E(s.code)}</span>${tag(s.env)}</div><h4>${E(s.title)}</h4><p>${clean(s.text)}</p>${s.command?codeBlock(s.id,s.command,s.env):''}${s.evidenceId?`<div data-ev="${s.evidenceId}" data-c="0">${evBlock(s.evidenceId,false)}</div>`:''}</div></article>`}
function secHtml(sec){const n=sec.steps.length,d=sec.steps.filter(s=>appState.completedSteps[s.id]).length;
  return `<section class="sec${sec.isWarning?' warn':''}" id="sec-${sec.id}"><header><h3>${E(sec.title)}</h3><div class="sh">${tag(sec.badge)}<span class="cnt" id="sc-${sec.id}">${d}/${n}</span></div></header><p class="mu">${E(sec.description)}</p><div class="bar" id="sbar-${sec.id}"><i style="width:${pctOf(d,n)}%"></i></div>${sec.steps.map(stepHtml).join('')}</section>`}
function intro(k){
  if(k==='tab1')return `<p class="lead">${clean(INTRO)}</p><div class="note"><b>3 hallazgos críticos de la auditoría</b><ul><li>El volumen de expedientes <b>no está cifrado</b> en reposo.</li><li><b>No existen respaldos</b> (instantáneas) ante ransomware o borrado.</li><li>Se desconoce si las instantáneas pueden <b>exponerse públicamente</b> por error.</li></ul></div><details class="acc"><summary>Referencia: Amazon EBS vs. Amazon S3</summary><div class="tbl"><table><thead><tr><th>Característica</th><th>Amazon EBS</th><th>Amazon S3</th></tr></thead><tbody>${CMP.map(r=>`<tr>${r.map(c=>`<td>${clean(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  if(k==='tab2')return `<ol class="flow">${FLOW.map(([a,b],i)=>`<li><b>${i+1}</b><span>${a}</span>${tag(b)}</li>`).join('')}</ol><p class="mu">Cada paso indica en qué entorno ejecutarlo.</p>`;
  return `<p class="lead">Un volumen EBS existente sin cifrar <b>no puede cifrarse en el lugar</b>. Ruta de migración: instantánea sin cifrar → copia cifrada (KMS) → nuevo volumen cifrado → reemplazo.</p>`}
function evView(){const f=appState.evidenceFilter||'all',ids=Object.keys(EVIDENCES_META),n=ids.filter(i=>evidenceImages[i]).length;
  const show=ids.filter(i=>f==='all'||(f==='completed')===!!evidenceImages[i]);
  const b=(v,l)=>`<button class="${f===v?'on':''}" onclick="setFilter('${v}')">${l}</button>`;
  return `<h1>Evidencias</h1><p class="sub1">${n} de ${ids.length} capturas · selecciona una tarjeta y pega con Ctrl+V</p><div class="seg">${b('all','Todas ('+ids.length+')')}${b('pending','Faltantes ('+(ids.length-n)+')')}${b('completed','Completadas ('+n+')')}</div><div class="evg">${show.map(i=>`<div data-ev="${i}" data-c="1">${evBlock(i,true)}</div>`).join('')||'<p class="mu">No hay evidencias en este filtro.</p>'}</div>`}

      const base = 'Reporte-AWS-EBS-ClinicaVida';
      if (!window.JSZip) {
        const md = buildReportMarkdown(d, (m, rec) => rec.dataUrl);
        downloadBlob(new Blob([md], { type: 'text/markdown;charset=utf-8' }), `${base}.md`);
        showToast('JSZip no cargó (¿sin internet?): .md con imágenes incrustadas en base64.', 'info');
        return;
      }
      const zip = new JSZip();
      const names = {};
      d.evidences.forEach(({ meta: m, rec }) => { if (rec) names[m.id] = `images/${m.fileName.replace(/\.\w+$/, '')}.${imgExt(rec)}`; });
      zip.file(`${base}.md`, buildReportMarkdown(d, (m) => names[m.id]));
      d.evidences.forEach(({ meta: m, rec }) => { if (rec) zip.file(names[m.id], rec.dataUrl.split(',')[1], { base64: true }); });
      downloadBlob(await zip.generateAsync({ type: 'blob' }), `${base}.zip`);
    }

    function printPdf(d, th, lay) {
      const frame = document.createElement('iframe');
      frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
      document.body.appendChild(frame);
      frame.onload = () => {
        const w = frame.contentWindow;
        const imgs = Array.from(w.document.images);
        Promise.all(imgs.map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }))).then(() => {
          const oldTitle = document.title;
          document.title = 'Reporte-AWS-EBS-ClinicaVida';
          w.addEventListener('afterprint', () => { document.title = oldTitle; setTimeout(() => frame.remove(), 500); });
          w.focus(); w.print();
        });
      };
      frame.srcdoc = buildReportHtml(d, th, lay);
    }

    async function runExport() {
      const fmt = (document.querySelector('input[name="exp-format"]:checked') || {}).value || 'html';
      try {
        const d = collectReportData();
        const { theme, lay } = chooseReportStyle();
        if (fmt === 'html') downloadBlob(new Blob([buildReportHtml(d, theme, lay)], { type: 'text/html;charset=utf-8' }), 'Reporte-AWS-EBS-ClinicaVida.html');
        else if (fmt === 'md') await exportMarkdown(d);
        else printPdf(d, theme, lay);
        closeExportModal();
        showToast(fmt === 'md' ? 'Markdown exportado (.zip con imágenes).' : `Reporte ${fmt.toUpperCase()} listo · estilo «${theme.name}» (${lay.head}/${lay.card}/${lay.table})`, 'success');
      } catch (err) {
        console.error(err);
        showToast('No se pudo generar el reporte.', 'error');
      }
    }

function saveProgress(){try{
  const payload={version:1,exportedAt:new Date().toISOString(),appState,evidenceImages};
  downloadBlob(new Blob([JSON.stringify(payload)],{type:'application/json'}),`Progreso-AWS-EBS-ClinicaVida-${new Date().toISOString().slice(0,10)}.json`);
  meta={backupAt:payload.exportedAt,dirty:false};persistMeta();renderSide();showToast('Progreso guardado en un archivo .json.','success')}catch(e){console.error(e);showToast('No se pudo generar el archivo .json.','error')}}
function loadProgress(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const p=JSON.parse(r.result);if(!p||typeof p.appState!=='object'||!p.appState)throw new Error('formato');const a=p.appState;
    appState={...appState,...a,completedSteps:a.completedSteps||{},evidenceNotes:a.evidenceNotes||{},analysisAnswers:a.analysisAnswers||{},studentInfo:a.studentInfo||{name:'',group:''}};
    await clearImgs();for(const id of Object.keys(p.evidenceImages||{})){const x=p.evidenceImages[id];if(x&&x.dataUrl&&EVIDENCES_META[id])await putImg(x)}
    meta={backupAt:p.exportedAt||null,dirty:false};persistMeta();saveLocalState(false);show(appState.activeTab||'tab1',true);const s=stats();showToast(`Progreso cargado: ${s.sd}/${s.st} pasos, ${s.ed}/${s.et} evidencias.`,'success')}
    catch(e){console.error(e);showToast('Ese archivo no es un progreso válido de esta práctica.','error')}finally{ev.target.value=''}};r.readAsText(f)}
async function confirmReset(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}await clearImgs();
  appState={completedSteps:{},evidenceNotes:{},analysisAnswers:{},studentInfo:{name:'',group:''},activeTab:'tab1',evidenceFilter:'all'};meta={backupAt:meta.backupAt,dirty:false};persistMeta();closeOv('reset-ov');show('tab1');showToast('Práctica reiniciada.','info')}

window.addEventListener('DOMContentLoaded',async()=>{loadLocalState();try{await initDB();(await idb('readonly',s=>s.getAll())||[]).forEach(r=>evidenceImages[r.id]=r)}catch(e){}show(appState.activeTab||'tab1',true)});
</script>
